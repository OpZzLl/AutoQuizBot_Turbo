<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Auto Quiz Bot Turbo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: 320px;
    padding: 16px 14px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #090d16;
    color: #e2e8f0;
    text-align: center;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 3px;
  }
  .logo { font-size: 24px; }
  h1 { font-size: 16px; color: #93c5fd; font-weight: 700; }
  .badge {
    display: inline-block;
    font-size: 10.5px;
    color: #38bdf8;
    background: #0369a133;
    border: 1px solid #0284c7;
    border-radius: 999px;
    padding: 2px 10px;
    margin-bottom: 10px;
  }
  .speed-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #111827;
    border: 1px solid #374151;
    border-radius: 8px;
    padding: 7px 10px;
    margin-bottom: 8px;
  }
  .speed-box label {
    font-size: 11.5px;
    color: #cbd5e1;
    font-weight: 600;
  }
  .speed-select {
    background: #1e293b;
    border: 1px solid #3b82f6;
    border-radius: 6px;
    color: #38bdf8;
    padding: 4px 6px;
    font-size: 11px;
    font-weight: 700;
    outline: none;
    cursor: pointer;
  }
  .toggle-group {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .toggle-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #cbd5e1;
    cursor: pointer;
    user-select: none;
    text-align: left;
  }
  .toggle-item input[type="checkbox"] {
    accent-color: #10b981;
    width: 14px;
    height: 14px;
    cursor: pointer;
  }
  .btn-auto {
    width: 100%;
    background: linear-gradient(135deg, #7c3aed, #9333ea);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(124,58,237,0.45);
    margin-bottom: 6px;
    transition: all 0.15s ease;
  }
  .btn-auto:hover {
    background: linear-gradient(135deg, #6d28d9, #7e22ce);
  }
  .btn-auto.active {
    background: linear-gradient(135deg, #b91c1c, #dc2626);
    box-shadow: 0 4px 14px rgba(220,38,38,0.45);
  }
  .btn-run {
    width: 100%;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(37,99,235,0.35);
    margin-bottom: 6px;
    transition: all 0.15s ease;
  }
  .btn-run:hover {
    background: linear-gradient(135deg, #1d4ed8, #1e40af);
  }
  .action-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .btn-submit {
    flex: 1;
    background: linear-gradient(135deg, #059669, #10b981);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 6px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(16,185,129,0.3);
    transition: all 0.15s ease;
  }
  .btn-submit:hover {
    background: linear-gradient(135deg, #047857, #059669);
  }
  .btn-next-step {
    flex: 1;
    background: #1e293b;
    color: #38bdf8;
    border: 1px solid #0284c7;
    border-radius: 8px;
    padding: 8px 6px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-next-step:hover {
    background: #0284c722;
  }
  .btn-stop {
    width: 100%;
    background: #dc2626;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    display: none;
    margin-bottom: 8px;
    box-shadow: 0 4px 14px rgba(220,38,38,0.4);
  }
  .btn-stop:hover { background: #b91c1c; }
  .btn-reload {
    background: #1e293b;
    color: #cbd5e1;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 6px;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn-reload:hover { background: #334155; }
  .btn-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .btn-row .btn-reload {
    flex: 1;
  }
  .msg-box {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 8px;
    padding: 8px;
    font-size: 11.5px;
    color: #4ade80;
    margin-bottom: 8px;
    font-weight: 600;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.3;
    word-break: break-word;
  }
  .msg-box.running { color: #60a5fa; }
  .msg-box.error { color: #f87171; }
  .msg-box.done { color: #4ade80; }
  .tip {
    background: #1e293b;
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 10px;
    color: #94a3b8;
    border: 1px solid #334155;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="header">
    <span class="logo">🤖</span>
    <h1>Auto Quiz Bot Turbo</h1>
  </div>
  <div class="badge">v8.2 • Auto-Detect & Pilot Edition</div>

  <div class="speed-box">
    <label>⚡ ความเร็ว:</label>
    <select id="popup-speed" class="speed-select" title="ปรับความเร็วในการตอบ">
      <option value="100">⚡ ความเร็วแสง (100ms)</option>
      <option value="200" selected>🚀 เร็วมาก (200ms)</option>
      <option value="350">⏱️ ปลอดภัย (350ms)</option>
      <option value="800">🛡️ ปานกลาง (800ms)</option>
    </select>
  </div>

  <div class="toggle-group">
    <label class="toggle-item">
      <input type="checkbox" id="chk-auto-submit">
      <span>⚡ ส่งคำตอบอัตโนมัติ (Auto-Submit)</span>
    </label>
    <label class="toggle-item">
      <input type="checkbox" id="chk-auto-next">
      <span>⏩ Auto-Next: ทำเสร็จแล้ว Next (ไม่เจอก็ Next)</span>
    </label>
  </div>

  <!-- Main Auto Detect Button -->
  <button id="btn-auto-detect" class="btn-auto" title="เปิดโหมดตรวจจับ: เมื่อเปิดเจอข้อสอบ บอทจะเริ่มทำให้อัตโนมัติทันที">
    🤖 เริ่มโหมด Auto (ทำทันทีเมื่อเจอข้อสอบ)
  </button>

  <button id="btn-start-now" class="btn-run" title="ทำข้อสอบในหน้านี้ทันทีหนึ่งรอบ">
    ▶ ทำข้อสอบหน้านี้ทันที
  </button>

  <div class="action-row">
    <button id="btn-submit-all" class="btn-submit" title="กดส่งคำตอบทุกข้อในหน้านี้">
      🚀 ส่งคำตอบทั้งหมด
    </button>
    <button id="btn-next-now" class="btn-next-step" title="กด Next ไปยังหน้าถัดไป">
      ⏩ หน้าถัดไป (Next)
    </button>
  </div>

  <button id="btn-stop-now" class="btn-stop">
    ⬛ หยุดการทำงานทั้งหมด
  </button>

  <div class="btn-row">
    <button id="btn-refresh-tab" class="btn-reload">
      🔄 รีเฟรช (F5)
    </button>
    <button id="btn-reset-state" class="btn-reload" style="border-color: #ef444455; color: #fca5a5;">
      🧹 รีเซ็ตสถานะ
    </button>
  </div>

  <div id="status-msg" class="msg-box">🟢 Gemini AI พร้อมทำงาน</div>

  <div class="tip">
    💡 คีย์ลัด: <strong>Alt + A</strong> (เปิด/ปิด Auto) | <strong>Alt + S</strong> (ทำหน้านี้) | <strong>Alt + X</strong> (ส่งทั้งหมด)
  </div>

  <script src="popup.js"></script>
</body>
</html>
